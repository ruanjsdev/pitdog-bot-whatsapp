<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pits Dog - Pedidos WhatsApp</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>Pits Dog</h1>
          <p>Painel simples para testar pedidos e avisos no WhatsApp.</p>
        </div>
        <div class="status" id="botStatus">Conferindo conexao...</div>
      </section>

      <section class="qrcodeModal" id="qrcodeModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div class="qrcodeBox" style="background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 500px;">
          <h2>Escaneie o QR Code</h2>
          <p style="color: #666; margin-bottom: 20px;">Abra WhatsApp da loja > Aparelhos conectados > Conectar um aparelho</p>
          <div id="qrcodeContainer" style="padding: 20px; background: #f5f5f5; border-radius: 8px; margin-bottom: 20px;">
            <img id="qrcodeImage" src="" alt="QR Code" style="max-width: 300px; display: block; margin: 0 auto;">
          </div>
          <p style="font-size: 12px; color: #999;">QR Code gerado em: <span id="qrcodeTime">--:--</span></p>
        </div>
      </section>

      <section class="grid">
        <form class="panel" id="orderForm">
          <h2>Novo pedido</h2>
          <label>
            PIN do painel
            <input name="pin" type="password" placeholder="1234" autocomplete="current-password">
          </label>
          <label>
            Nome do cliente
            <input name="customerName" placeholder="Maria">
          </label>
          <label>
            WhatsApp do cliente
            <input name="customerPhone" placeholder="91999999999" required>
          </label>
          <label>
            Observacao geral
            <textarea name="notes" rows="2" placeholder="Ex: entregar sem buzinar"></textarea>
          </label>
          <section class="cartBox">
            <div class="listHeader compact">
              <h2>Carrinho</h2>
              <strong id="cartTotal">R$ 0,00</strong>
            </div>
            <div class="cartItems" id="cartItems"></div>
          </section>
          <button type="submit">Criar pedido e avisar</button>
          <p class="feedback" id="feedback"></p>
        </form>

        <section class="panel">
          <h2>Cardapio</h2>
          <div class="menu" id="menu"></div>
        </section>

        <section class="panel ordersPanel">
          <div class="listHeader">
            <h2>Pedidos</h2>
            <button type="button" class="secondary" id="refreshButton">Atualizar</button>
          </div>
          <div class="orders" id="orders"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
